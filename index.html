<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>YUVARAJ · Found item</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#edf4ff;background:radial-gradient(ellipse at 20% 15%,#1d3b4266,transparent 55%),radial-gradient(ellipse at 85% 90%,#3a2f5e55,transparent 55%),#0b111c;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) max(22px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(22px,env(safe-area-inset-left));text-align:center}
.top{width:100%;max-width:420px}
.bag{margin:0 auto clamp(10px,3vw,16px);display:grid;place-items:center;width:clamp(58px,16vw,74px);height:clamp(58px,16vw,74px);border-radius:20px;background:linear-gradient(135deg,#b1edd117,#95bbf209);color:#aee3d3;border:1px solid #d5ecff25}
.bag svg{width:52%;height:52%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
h1{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px;font-size:clamp(19px,6vw,25px);font-weight:750}
h1 span{letter-spacing:.3em;margin-right:-.3em}
.flag{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px #ffffff29;transform-origin:0% 50%;animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-3deg) scaleY(.97)}50%{transform:rotate(0deg)}75%{transform:rotate(3deg) scaleY(.97)}}
.sub{margin:0;color:#93a3b5;font-size:clamp(13px,3.8vw,14.5px);line-height:1.5}
.actions{flex:none;width:100%;max-width:420px;margin-top:clamp(30px,8vh,48px);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,18px)}
.action{display:flex;flex-direction:column;align-items:center;gap:10px;border:none;background:none;color:#edf4ff;padding:0;font:inherit;font-size:clamp(12.5px,3.4vw,14px);font-weight:600;text-decoration:none;cursor:pointer;transition:transform .12s ease}
.action:active{transform:scale(.93)}
.tile{display:grid;place-items:center;width:clamp(66px,20vw,88px);height:clamp(66px,20vw,88px);border-radius:24px;border:1px solid #ffffff1c;background:linear-gradient(145deg,#ffffff10,#ffffff02);backdrop-filter:blur(14px)}
.tile svg{width:38%;height:38%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.whatsapp .tile{color:#80e8b0}
.email .tile{color:#eaca92}
.location .tile{color:#8ebcff}
#locStatus{min-height:18px;margin:12px 2px 0;font-size:12.5px;color:#a5ddc2;text-align:center;max-width:420px}
.foot{margin-top:clamp(24px,8vh,48px);width:24px;height:24px;border-radius:50%;border:1px solid #7b879470;color:#8795a6;background:none;font-size:11px;font-weight:700;line-height:1;cursor:pointer;opacity:.6}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="top">
<div class="bag" role="img" aria-label="Luggage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2.3"/><path d="M9 7V5a1.4 1.4 0 0 1 1.4-1.4h3.2A1.4 1.4 0 0 1 15 5v2"/><path d="M12 10v7"/><circle cx="8.4" cy="21.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.6" cy="21.2" r="1" fill="currentColor" stroke="none"/></svg></div>
<h1><span id="nameText">YUVARAJ</span><svg class="flag" viewBox="0 0 36 24" role="img" aria-label="India"><rect width="36" height="8" fill="#ff9933"/><rect y="8" width="36" height="8" fill="#fff"/><rect y="16" width="36" height="8" fill="#138808"/></svg></h1>
<p class="sub">Found this bag? Reach me directly — thank you.</p>
</div>
<div class="actions">
<a class="action whatsapp" href="https://wa.me/919894012736?text=Hi%21%20Thanks%20for%20connecting%20%F0%9F%99%8F%0AIf%20you%20found%20my%20bag%2C%20it%20would%20really%20help%20if%20you%20could%3A%0A-%20Share%20your%20current%20location%0A-%20Send%20a%20quick%20photo%20of%20it%0A-%20Let%20me%20know%20how%20best%20to%20reach%20you%0AThank%20you%20so%20much%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-13.4 7.8L3 21l1.7-4.6A9 9 0 1 1 21 11.5Z"/><path d="M8 7c-2 3 3 8 6 8l2-2-3-1-1 1-3-3 1-1-2-2Z"/></svg></span><span class="label">WhatsApp</span></a>
<a class="action email" href="mailto:yuvarajstenny@gmail.com?subject=Found%20your%20bag%3F&body=Hi%20Yuvaraj%2C%0A%0AI%20think%20I%20found%20your%20bag.%20Here%20is%20what%20I%20can%20share%3A%0A-%20Location%3A%0A-%20Photo%3A%20%28attached%29%0A-%20My%20contact%3A%0A%0AThanks%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span><span class="label">Email</span></a>
<button class="action location" id="locBtn" type="button"><span class="tile"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span class="label">Location</span></button>
</div>
<p id="locStatus" role="status" aria-live="polite"></p>
<button type="button" class="foot" id="privacyBtn" aria-label="Privacy info">ⓘ</button>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbyEh-RwMFBA9HO05TdU8ye2r2rjPPd81PJ_xSe4sZZq4kp5hnaO1U3EOpxYehufIINiWA/exec';
function callBackend(action,payload){
  const url=BACKEND_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload));
  return fetch(url).then(r=>r.json());
}

// Three languages only, picked for where this tag is likely to travel:
// English (default/India), Traditional Chinese (Hong Kong/Taiwan), Thai.
// Detected from the scanning phone's own browser language — never asked,
// never logged, just read once to pick which strings to show.
const STR={
  en:{name:"YUVARAJ",sub:"Found this bag? Reach me directly — thank you.",email:"Email",location:"Location",
    privacy:"This page logs a basic visit record (approximate city, device/browser type, screen size, timezone) so Yuvaraj knows it's being scanned. Nothing you type or share is sent unless you tap WhatsApp, Email, or Share location.",
    waText:"Hi! Thanks for connecting 🙏\nIf you found my bag, it would really help if you could:\n- Share your current location\n- Send a quick photo of it\n- Let me know how best to reach you\nThank you so much!",
    mailSubject:"Found your bag?",
    mailBody:"Hi Yuvaraj,\n\nI think I found your bag. Here is what I can share:\n- Location:\n- Photo: (attached)\n- My contact:\n\nThanks!",
    locUnavailable:"Location unavailable on this device/browser.",locGetting:"Getting your location…",
    locSent:"Location sent. Thank you!",locFail:"Could not confirm sending. Please try WhatsApp or Email instead.",
    locDenied:"Location access denied. Try WhatsApp or Email instead.",locError:"Could not get your location. Try again or use WhatsApp/Email."},
  zh:{name:"尤瓦拉吉",sub:"找到這個行李箱了嗎?請直接聯絡我,謝謝您!",email:"電郵",location:"位置",
    privacy:"此頁面會記錄基本的訪問資訊(大約城市、裝置/瀏覽器類型、螢幕大小、時區),讓 Yuvaraj 知道這個標籤正被掃描。除非您點擊 WhatsApp、電郵或分享位置,否則不會傳送您輸入或分享的任何內容。",
    waText:"您好!感謝您與我聯絡 🙏\n如果您找到了我的行李,麻煩您:\n- 分享您目前的位置\n- 傳送一張照片\n- 告訴我最方便聯絡您的方式\n非常感謝!",
    mailSubject:"找到您的行李了嗎?",
    mailBody:"您好 Yuvaraj,\n\n我想我找到了您的行李。以下是我可以提供的資訊:\n- 位置:\n- 照片:(附件)\n- 我的聯絡方式:\n\n謝謝!",
    locUnavailable:"此裝置/瀏覽器無法取得位置。",locGetting:"正在取得您的位置…",
    locSent:"位置已傳送,謝謝您!",locFail:"無法確認是否已傳送,請改用 WhatsApp 或電郵。",
    locDenied:"位置存取遭拒,請改用 WhatsApp 或電郵。",locError:"無法取得您的位置,請重試或改用 WhatsApp/電郵。"},
  th:{name:"ยุวราช",sub:"เจอกระเป๋าใบนี้ไหม? ติดต่อฉันได้โดยตรง ขอบคุณมาก",email:"อีเมล",location:"ตำแหน่ง",
    privacy:"หน้านี้จะบันทึกข้อมูลการเข้าชมพื้นฐาน (เมืองโดยประมาณ ประเภทอุปกรณ์/เบราว์เซอร์ ขนาดหน้าจอ เขตเวลา) เพื่อให้ Yuvaraj ทราบว่าแท็กนี้ถูกสแกน ข้อมูลที่คุณพิมพ์หรือแชร์จะไม่ถูกส่งไป เว้นแต่คุณจะแตะ WhatsApp อีเมล หรือแชร์ตำแหน่ง",
    waText:"สวัสดี ขอบคุณที่ติดต่อมา 🙏\nถ้าคุณเจอกระเป๋าของฉัน จะเป็นประโยชน์มากถ้าคุณ:\n- แชร์ตำแหน่งปัจจุบันของคุณ\n- ส่งรูปถ่ายกระเป๋าสั้นๆ ให้ดู\n- บอกฉันว่าติดต่อคุณกลับทางไหนดีที่สุด\nขอบคุณมากๆ!",
    mailSubject:"เจอกระเป๋าของฉันหรือเปล่า?",
    mailBody:"สวัสดี Yuvaraj\n\nฉันคิดว่าเจอกระเป๋าของคุณแล้ว นี่คือสิ่งที่ฉันแชร์ได้:\n- ตำแหน่ง:\n- รูปถ่าย: (แนบมาด้วย)\n- ช่องทางติดต่อของฉัน:\n\nขอบคุณ!",
    locUnavailable:"อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับตำแหน่ง",locGetting:"กำลังรับตำแหน่งของคุณ…",
    locSent:"ส่งตำแหน่งแล้ว ขอบคุณมาก!",locFail:"ไม่สามารถยืนยันการส่งได้ กรุณาลองใช้ WhatsApp หรืออีเมลแทน",
    locDenied:"การเข้าถึงตำแหน่งถูกปฏิเสธ กรุณาใช้ WhatsApp หรืออีเมลแทน",locError:"ไม่สามารถรับตำแหน่งของคุณได้ กรุณาลองใหม่หรือใช้ WhatsApp/อีเมล"}
};
// Fixed order, always starting with English, looping on a timer — the
// phone's own language setting is deliberately not used here. "WhatsApp"
// stays as-is in every pass since it's a brand name, not translated text.
const LANGS=['en','zh','th'];
const HTML_LANG={en:'en',zh:'zh-Hant',th:'th'};
let langIdx=0,t=STR[LANGS[0]];
const nameEl=document.getElementById('nameText'),subEl=document.querySelector('.sub'),emailLabelEl=document.querySelector('.email .label'),locationLabelEl=document.querySelector('.location .label');
const waLink=document.querySelector('.action.whatsapp'),emailLink=document.querySelector('.action.email');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fadeEls=[nameEl,subEl,emailLabelEl,locationLabelEl];
fadeEls.forEach(el=>{el.style.transition='opacity .25s ease'});

function applyLang(key,animate){
  t=STR[key];
  document.documentElement.lang=HTML_LANG[key];
  const render=()=>{
    nameEl.textContent=t.name;
    subEl.textContent=t.sub;
    emailLabelEl.textContent=t.email;
    locationLabelEl.textContent=t.location;
    waLink.href='https://wa.me/919894012736?text='+encodeURIComponent(t.waText);
    emailLink.href='mailto:yuvarajstenny@gmail.com?subject='+encodeURIComponent(t.mailSubject)+'&body='+encodeURIComponent(t.mailBody);
  };
  if(!animate||reduceMotion){render();return;}
  fadeEls.forEach(el=>el.style.opacity=0);
  setTimeout(()=>{render();fadeEls.forEach(el=>el.style.opacity=1);},260);
}
applyLang(LANGS[0],false);
if(!reduceMotion){
  setInterval(()=>{langIdx=(langIdx+1)%LANGS.length;applyLang(LANGS[langIdx],true);},3200);
}
document.getElementById('privacyBtn').addEventListener('click',()=>alert(t.privacy));

(function logScan(){
  const base={device:navigator.userAgent.slice(0,300),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',referrer:document.referrer||'',screen:screen.width+'x'+screen.height,touchPoints:navigator.maxTouchPoints||0};
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(geo=>{
    callBackend('logScan',Object.assign({},base,{approxLocation:[geo.city,geo.region,geo.country_name].filter(Boolean).join(', ')}));
  }).catch(()=>{ callBackend('logScan',base); });
})();
const locBtn=document.getElementById('locBtn'),locStatus=document.getElementById('locStatus');
locBtn.addEventListener('click',()=>{
  if(!window.isSecureContext||!navigator.geolocation){locStatus.textContent=t.locUnavailable;return;}
  locBtn.disabled=true;locStatus.textContent=t.locGetting;
  navigator.geolocation.getCurrentPosition(pos=>{
    callBackend('locationPing',{lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy})
      .then(()=>{locStatus.textContent=t.locSent;})
      .catch(()=>{locStatus.textContent=t.locFail;})
      .finally(()=>{locBtn.disabled=false;});
  },err=>{
    locStatus.textContent=err.code===1?t.locDenied:t.locError;
    locBtn.disabled=false;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
</script>
</body>
</html>
