<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>YUVARAJ · Found item</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:#15181d;background:#f5f6f8;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 7vh) 24px calc(env(safe-area-inset-bottom) + 22px);text-align:center}
.bag{margin:0 0 12px;display:grid;place-items:center;width:clamp(44px,12vw,54px);height:clamp(44px,12vw,54px);border-radius:16px;background:#fff;box-shadow:0 2px 10px #00000014}
.bag svg{width:52%;height:52%;stroke:#15181d;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h1{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px;font-size:clamp(18px,5.5vw,23px);font-weight:700;letter-spacing:.2px}
.flag{width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 1px #0000000f}
.sub{margin:0;font-size:clamp(13px,3.6vw,14.5px);color:#6b7280;max-width:300px}
.actions{margin-top:clamp(26px,7vh,44px);display:flex;flex-direction:column;gap:12px;width:min(100%,360px)}
.action{display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:20px;background:#fff;color:#15181d;padding:14px 16px;font:inherit;font-size:clamp(14px,3.8vw,15.5px);font-weight:600;text-decoration:none;cursor:pointer;box-shadow:0 1px 3px #0000000f,0 8px 20px #00000010;transition:transform .12s ease,box-shadow .12s ease}
.action:active{transform:scale(.97);box-shadow:0 1px 2px #00000012}
.tile{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%}
.tile svg{width:22px;height:22px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.whatsapp .tile{background:#e6f9ee;stroke:#25D366}
.email .tile{background:#fff1e9;stroke:#ff7a45}
.location .tile{background:#eaf1ff;stroke:#3b6fe0}
.label{text-align:left}
.label small{display:block;font-weight:400;font-size:11.5px;color:#9aa1ab;margin-top:1px}
#locStatus{min-height:18px;margin:12px 2px 0;font-size:12.5px;color:#3b6fe0;font-weight:600}
.foot{margin-top:auto;padding-top:18px;font-size:10.5px;line-height:1.6;color:#9aa1ab;max-width:300px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bag"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="14" rx="3"/><path d="M9 6V4h6v2M9 10v6m6-6v6M8 20v1m8-1v1"/></svg></div>
<h1><span>YUVARAJ</span><svg class="flag" viewBox="0 0 36 24" role="img" aria-label="India"><rect width="36" height="8" fill="#ff9933"/><rect y="8" width="36" height="8" fill="#fff"/><rect y="16" width="36" height="8" fill="#138808"/></svg></h1>
<p class="sub">Found this bag? Reach me directly — thank you.</p>
<div class="actions">
<a class="action whatsapp" href="https://wa.me/919894012736?text=Hi%21%20Thanks%20for%20connecting%20%F0%9F%99%8F%0AIf%20you%20found%20my%20bag%2C%20it%20would%20really%20help%20if%20you%20could%3A%0A-%20Share%20your%20current%20location%0A-%20Send%20a%20quick%20photo%20of%20it%0A-%20Let%20me%20know%20how%20best%20to%20reach%20you%0AThank%20you%20so%20much%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-13.4 7.8L3 21l1.7-4.6A9 9 0 1 1 21 11.5Z"/><path d="M8 7c-2 3 3 8 6 8l2-2-3-1-1 1-3-3 1-1-2-2Z"/></svg></span><span class="label">WhatsApp<small>Chat instantly</small></span></a>
<a class="action email" href="mailto:yuvarajstenny@gmail.com?subject=Found%20your%20bag%3F&body=Hi%20Yuvaraj%2C%0A%0AI%20think%20I%20found%20your%20bag.%20Here%20is%20what%20I%20can%20share%3A%0A-%20Location%3A%0A-%20Photo%3A%20%28attached%29%0A-%20My%20contact%3A%0A%0AThanks%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span><span class="label">Email<small>Send a note</small></span></a>
<button class="action location" id="locBtn" type="button"><span class="tile"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span class="label">Share location<small>Sends your spot straight to me</small></span></button>
</div>
<p id="locStatus" role="status" aria-live="polite"></p>
<p class="foot">Visits here log approximate city &amp; device to show this tag is active.</p>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbzOHkdZcueRcUxPbJRyGM6K5GS9T3_51CgNB94UZHFDKBWHKtCzJ26EOCt9gTAY_GjgEQ/exec';
function callBackend(action,payload){
  const url=BACKEND_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload));
  return fetch(url).then(r=>r.json());
}
(function logScan(){
  const base={device:navigator.userAgent.slice(0,300),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',referrer:document.referrer||'',screen:screen.width+'x'+screen.height,touchPoints:navigator.maxTouchPoints||0};
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(geo=>{
    callBackend('logScan',Object.assign({},base,{approxLocation:[geo.city,geo.region,geo.country_name].filter(Boolean).join(', ')}));
  }).catch(()=>{ callBackend('logScan',base); });
})();
const locBtn=document.getElementById('locBtn'),locStatus=document.getElementById('locStatus');
locBtn.addEventListener('click',()=>{
  if(!window.isSecureContext||!navigator.geolocation){locStatus.textContent='Location unavailable on this device/browser.';return;}
  locBtn.disabled=true;locStatus.textContent='Getting your location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    callBackend('locationPing',{lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy})
      .then(()=>{locStatus.textContent='Location sent. Thank you!';})
      .catch(()=>{locStatus.textContent='Could not confirm sending. Please try WhatsApp or Email instead.';})
      .finally(()=>{locBtn.disabled=false;});
  },err=>{
    locStatus.textContent=err.code===1?'Location access denied. Try WhatsApp or Email instead.':'Could not get your location. Try again or use WhatsApp/Email.';
    locBtn.disabled=false;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
</script>
</body>
</html>
