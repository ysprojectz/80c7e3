<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>YUVARAJ · Found item</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);text-align:center;
background:linear-gradient(135deg,#ff7a59,#c2487a 45%,#5b3bd6 85%);background-size:220% 220%;animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.bag{margin:0 0 10px;display:grid;place-items:center;width:clamp(58px,16vw,74px);height:clamp(58px,16vw,74px);border-radius:20px;background:#ffffff22;border:1px solid #ffffff3a}
.bag svg{width:52%;height:52%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
h1{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 6px;font-size:clamp(19px,6vw,25px);font-weight:800;text-shadow:0 2px 14px #00000030}
h1 span{letter-spacing:.3em;margin-right:-.3em}
.flag{width:26px;height:17px;border-radius:3px;box-shadow:0 0 0 1px #ffffff40;transform-origin:0% 50%;animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-3deg) scaleY(.97)}50%{transform:rotate(0deg)}75%{transform:rotate(3deg) scaleY(.97)}}
.sub{margin:0;font-size:clamp(13px,3.8vw,15px);color:#ffffffd0;max-width:320px}
.actions{margin-top:clamp(30px,8vh,48px);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,18px);width:min(100%,380px)}
.action{display:flex;flex-direction:column;align-items:center;gap:10px;border:none;background:none;color:#fff;padding:0;font:inherit;font-size:clamp(12.5px,3.4vw,14px);font-weight:700;text-decoration:none;cursor:pointer;transition:transform .12s ease;text-shadow:0 1px 6px #00000030}
.action:active{transform:scale(.93)}
.tile{display:grid;place-items:center;width:clamp(66px,20vw,88px);height:clamp(66px,20vw,88px);border-radius:24px;box-shadow:0 10px 26px #00000028}
.tile svg{width:38%;height:38%;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.whatsapp .tile{background:#25D366;stroke:#fff}
.email .tile{background:#ff7a59;stroke:#fff}
.location .tile{background:#5b3bd6;stroke:#fff}
#locStatus{min-height:18px;margin:12px 2px 0;font-size:12.5px;color:#fff;text-align:center;font-weight:600}
.foot{margin-top:clamp(24px,8vh,48px);width:24px;height:24px;border-radius:50%;border:1px solid #ffffff60;color:#fff;background:none;font-size:11px;font-weight:700;line-height:1;cursor:pointer;opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bag" role="img" aria-label="Luggage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="13" rx="2.3"/><path d="M9 7V5a1.4 1.4 0 0 1 1.4-1.4h3.2A1.4 1.4 0 0 1 15 5v2"/><path d="M12 10v7"/><circle cx="8.4" cy="21.2" r="1" fill="currentColor" stroke="none"/><circle cx="15.6" cy="21.2" r="1" fill="currentColor" stroke="none"/></svg></div>
<h1><span>YUVARAJ</span><svg class="flag" viewBox="0 0 36 24" role="img" aria-label="India"><rect width="36" height="8" fill="#ff9933"/><rect y="8" width="36" height="8" fill="#fff"/><rect y="16" width="36" height="8" fill="#138808"/></svg></h1>
<p class="sub">Found this bag? Tap below to reach me directly — thank you!</p>
<div class="actions">
<a class="action whatsapp" href="https://wa.me/919894012736?text=Hi%21%20Thanks%20for%20connecting%20%F0%9F%99%8F%0AIf%20you%20found%20my%20bag%2C%20it%20would%20really%20help%20if%20you%20could%3A%0A-%20Share%20your%20current%20location%0A-%20Send%20a%20quick%20photo%20of%20it%0A-%20Let%20me%20know%20how%20best%20to%20reach%20you%0AThank%20you%20so%20much%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-13.4 7.8L3 21l1.7-4.6A9 9 0 1 1 21 11.5Z"/><path d="M8 7c-2 3 3 8 6 8l2-2-3-1-1 1-3-3 1-1-2-2Z"/></svg></span><span class="label">WhatsApp</span></a>
<a class="action email" href="mailto:yuvarajstenny@gmail.com?subject=Found%20your%20bag%3F&body=Hi%20Yuvaraj%2C%0A%0AI%20think%20I%20found%20your%20bag.%20Here%20is%20what%20I%20can%20share%3A%0A-%20Location%3A%0A-%20Photo%3A%20%28attached%29%0A-%20My%20contact%3A%0A%0AThanks%21" target="_blank" rel="noopener"><span class="tile"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></span><span class="label">Email</span></a>
<button class="action location" id="locBtn" type="button"><span class="tile"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span class="label">Location</span></button>
</div>
<p id="locStatus" role="status" aria-live="polite"></p>
<button type="button" class="foot" aria-label="Privacy info" onclick="alert('This page logs a basic visit record (approximate city, device/browser type, screen size, timezone) so Yuvaraj knows it\'s being scanned. Nothing you type or share is sent unless you tap WhatsApp, Email, or Share location.')">ⓘ</button>
<script>
const BACKEND_URL='https://script.google.com/macros/s/AKfycbzOHkdZcueRcUxPbJRyGM6K5GS9T3_51CgNB94UZHFDKBWHKtCzJ26EOCt9gTAY_GjgEQ/exec';
function callBackend(action,payload){
  const url=BACKEND_URL+'?action='+encodeURIComponent(action)+'&payload='+encodeURIComponent(JSON.stringify(payload));
  return fetch(url).then(r=>r.json());
}
(function logScan(){
  const base={device:navigator.userAgent.slice(0,300),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'',referrer:document.referrer||'',screen:screen.width+'x'+screen.height,touchPoints:navigator.maxTouchPoints||0};
  fetch('https://ipapi.co/json/').then(r=>r.json()).then(geo=>{
    callBackend('logScan',Object.assign({},base,{approxLocation:[geo.city,geo.region,geo.country_name].filter(Boolean).join(', ')}));
  }).catch(()=>{ callBackend('logScan',base); });
})();
const locBtn=document.getElementById('locBtn'),locStatus=document.getElementById('locStatus');
locBtn.addEventListener('click',()=>{
  if(!window.isSecureContext||!navigator.geolocation){locStatus.textContent='Location unavailable on this device/browser.';return;}
  locBtn.disabled=true;locStatus.textContent='Getting your location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    callBackend('locationPing',{lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy})
      .then(()=>{locStatus.textContent='Location sent. Thank you!';})
      .catch(()=>{locStatus.textContent='Could not confirm sending. Please try WhatsApp or Email instead.';})
      .finally(()=>{locBtn.disabled=false;});
  },err=>{
    locStatus.textContent=err.code===1?'Location access denied. Try WhatsApp or Email instead.':'Could not get your location. Try again or use WhatsApp/Email.';
    locBtn.disabled=false;
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
</script>
</body>
</html>
